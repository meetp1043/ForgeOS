spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:forgeos}
    username: ${DB_USER:forgeos}
    password: ${DB_PASSWORD:forgeos_dev_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  flyway:
    enabled: true
    baseline-on-migrate: true

forgeos:
  security:
    jwt:
      secret: "4f6a7d5b8e9c0a1f2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a" # Development only, at least 256 bits
      access-token-expiration: 900000 # 15 minutes
      refresh-token-expiration: 604800000 # 7 days

logging:
  level:
    org.hibernate.SQL: DEBUG
